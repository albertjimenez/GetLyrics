[package]
name = "GetLyrics"
version = "0.3.3"
edition = "2024"

[[bin]]
name = "getlyrics"
path = "src/main.rs"

[dependencies]
audiotags = "0.5.0"
symphonia = { version = "0.6.1", features = ["mp3", "flac"] }
reqwest = { version = "0.13.5", features = ["native-tls-vendored", "blocking", "json", "query"] }
log = { version = "0.4.34", features = [] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
env_logger = "0.11.11"
sha2 = { version = "0.11.0" , features = []}
anyhow = "1.0.104"
dirs = "7.0.0"
rayon = "1.12.0"
walkdir = "2.5.0"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true